[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attnlens"
version = "0.1.0"
description = "Causal multi-head self-attention trained from scratch, with gradient verification and head analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["attnlens*"]
